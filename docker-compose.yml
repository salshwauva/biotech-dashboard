services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-biotech}
      POSTGRES_USER: ${POSTGRES_USER:-biotech}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-biotech}
    # Bound to loopback only. The database is not a public service.
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-biotech}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
